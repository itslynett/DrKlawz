services:
  - type: web
    name: drklawz-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: sh -c 'if [ -n "$DATABASE_URL" ]; then npx prisma db push; fi && npm run start:prod'
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
